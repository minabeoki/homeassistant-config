# scrape

- resource: 'https://traininfo.jreast.co.jp/train_info/line.aspx?gid=1&lineid=yamanoteline'
  scan_interval: 600
  headers:
    User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
  sensor:
    - name: JR info
      select: '.traininfo-line-info'
      value_template: '{{ value.strip() }}'
