##
## tomorrow weather and informations
##

- alias: Tomorrow Info
  trigger:
    - platform: time
      at: '00:00:00'
    - platform: time
      at: '01:00:00'
    - platform: time
      at: '02:00:00'
  action:
    - service: media_player.volume_set
      data_template:
        entity_id: media_player.google_living
        volume_level: 0.4
    - service: tts.google_say
      entity_id: media_player.google_living
      data_template:
        message: >
          {% if now().strftime('%H')|int==2 %}
            もう2時ですよ。
          {% endif %}
          {{ states('sensor.weather_forecast') }}
          {{ states('sensor.weather_forecast') }}
          {% if not is_state('sensor.trash_day', 'off') %}
            あと、
            {{ states('sensor.trash_day') }}
            {{ states('sensor.trash_day') }}
          {% endif %}

- alias: Night Jihou3
  trigger:
    - platform: time
      at: '03:00:00'
  action:
    - service: media_player.volume_set
      data_template:
        entity_id: media_player.google_living
        volume_level: 0.5
    - service: tts.google_say
      entity_id: media_player.google_living
      data_template:
        message: >
          {{ [
          "もう3時なんですよ。",
          "3時になりましたよ。",
          "3時になっちゃいました。",
          "やばい。3時ですよ。",
          ] | random }}

- alias: Moeru Gomi
  trigger:
    - platform: time
      at: '0:30:00'
    - platform: time
      at: '1:30:00'
  condition:
    - condition: time
      weekday:
        - wed
  action:
    - service: media_player.volume_set
      data_template:
        entity_id: media_player.google_living
        volume_level: 0.5
    - service: tts.google_say
      entity_id: media_player.google_living
      data_template:
        message: >
          {{ [
          "明日はごみの日です。",
          "ごみの準備しましたか？",
          "ごみ出すの忘れないで。",
          "ごみを出そうね。"
          ] | random }}

- alias: Shigen Gomi
  trigger:
    - platform: time
      at: '0:30:00'
    - platform: time
      at: '1:30:00'
  condition:
    - condition: time
