- alias: Train Info
  trigger:
    - platform: time
      at: '07:45:00'
    - platform: time
      at: '07:50:00'
    - platform: time
      at: '09:05:00'
    - platform: time
      at: '09:15:00'
    - platform: time
      at: '09:25:00'
    - platform: time
      at: '09:45:00'
  condition:
    condition: and
    conditions:
      - condition: template
        value_template: >
          {{ not is_state('sensor.jr_info', '平常運転') }}
      - condition: state
        entity_id: binary_sensor.workday_sensor
        state: 'on'
  action:
    - service: media_player.volume_set
      data_template:
        entity_id: media_player.google_living
        volume_level: 0.5
    - service: tts.google_say
      entity_id: media_player.google_living
      data_template:
        message: >
          {{ states('sensor.jr_info') }}
          {{ states('sensor.jr_info') }}

